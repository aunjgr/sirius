syntax = "proto3";

package matrixone.sirius.v1;

// Query-scoped identity for MO-native batches supplied over Arrow Flight.
// The relation data and transport ticket are deliberately absent.
message StreamRead {
  uint32 protocol_version = 1;
  uint64 feature_bits = 2;
  bytes stream_ref = 3;
  bytes query_id = 4;
  uint64 account_id = 5;
  bytes snapshot_ts = 6;
  bytes schema_digest = 7;
  bytes capability_hash = 8;
  uint64 expires_at_unix_ms = 9;
}
